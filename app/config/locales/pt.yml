  faq:
    page_title: Perguntas Frequentes
    up: Acima
    all_questions: Veja todas as perguntas
    button_assistance: Procure assistência
    questions:
      q1: Quais são as vantagens de participar das pesquisas do Fine Panel?
      q2: Como serão tratadas minhas respostas e meus dados pessoais?
      q3: Quem participa desta comunidade?
      q4: Eu serei convidado(a) a participar em estudos sobre quais assuntos?
      q5: Como posso saber quanto receberei por cada participação?
      q6: O que preciso fazer para receber meus honorários?
      q7: Qual é o prazo que eu tenho para participar após um convite?
      q8: Por que procura-se um perfil específico?
      q9: Como posso saber se eu tenho o perfil procurado?
      q10: Se tento participar, mas não tenho o perfil para esse projeto,serei recompensado(a) mesmo assim?
      q11: Posso participar regularmente?
      q12: Como receberei o pagamento?
      q13: Quando receberei o pagamento?
      q14: Como posso controlar meus pagamentos e minhas participações?
    answers:
      a1: É um canal para que o(a) Sr.(a) possa influir com suas opiniões e experiências nas discussões de futuras linhas terapêuticas, conhecer inovações na sua área, com as vantagens de participar online no horário que lhe for mais conveniente e sendo recompensado(a) com honorários depositados na sua conta bancária.
      a2: Com a máxima confidencialidade. Seus dados pessoais nunca serão fornecidos a terceiros nem vinculados a suas resposta, obedecendo as rígidas regras da Sociedade Europeia de Pesquisa de Mercados (www.esomar.org) e a Sociedade Europeia de Pesquisa Farmacêutica (www.ephmra.org/)
      a3: As pesquisas são destinadas exclusivamente a médicos ativos que moram na América Latina, credenciados conforme as leis aplicáveis. Temos milhares de participantes regulares.
      a4: Dependendo de sua prática médica e de sua especialidade, o(a) convidaremos às diferentes pesquisas que podem ser de seu interesse.
      a5: O honorário é indicado na carta de convite
      a6: o honorário é pago a aqueles que têm o perfil procurado para cada projeto e completam toda a pesquisa. As pesquisas têm uma duração de aproximadamente 15-40 minutos, dependendo do projeto e de seu navegador)
      a7: Os projetos têm um tempo limitado -geralmente dias- e além disso procuram-se uma quantidade de entrevistas determinadas. Por tanto, quanto antes participe melhor. Se o projeto já estiver fechado quando o(a) Sr.(a) entrar o sistema o informará.
      a8: Em todas as pesquisas há um público alvo o qual depende dos critérios e da área de interesse da equipe de pesquisa. As vezes há uma demanda de um determinado tipo de pacientes ou de práticas (pública ou privada), ou qualquer outro critério. Não ter o perfil para uma pesquisa especifica, não significa que o(a) Sr.(a) não seja um(a) grande profissional!
      a9: Verifica-se através de algumas perguntas iniciais que não levam mais do que 1-2 minutos.
      a10: Sim. Neste caso não vamos pedir que complete a pesquisa de 15 a 40 minutos, mas recompensaremos essas tentativas de 1-2 minutos, com o 10% do honorário prometido para a pesquisa completa. A quantia será depositada na sua conta bancária quando o crédito acumulado seja superior a $500 (Mexico) / 150$ (Argentina) / R$100 (Brasil) ou junto com a próxima entrevista completa.
      a11: Dependerá das pesquisas disponíveis referentes a sua especialidade, mas provavelmente sim! Nossa organização realiza mais de 100 estudos médicos por ano com diferentes tipos de especialistas, por tanto,terá muitas probabilidades de participar.
      a12: O método que sugerimos por velocidade e segurança é o depósito na sua conta bancária. Se o(a) Sr.(a) preferir, também podemos enviar um cheque por correio ao seu consultório. Após cada estudo os dados de pagamento são confirmados segundo sua preferência.
      a13: Os pagamentos de incentivos são realizados dentro das 4 semanas após sua participação em uma entrevista completa. O(a) Sr.(a) receberá um correio eletrônico confirmando as informações de pagamento, data e quantia, assim que o pagamento tiver sido realizado.
      a14: O Fine Panel permite um acesso transparente a seus créditos e participações. Se deseja verificar seu crédito pode fazê-lo em qualquer momento logo após completar uma primeira entrevista. Deve ir á página www.fine-panel.com/medicos e usando o correio ao qual foi convidado como usuário e senha, entre em -Minha Conta- e- Honorários- deste portal. Aí, poderá ver as últimas participações, estado de cada uma, pagamentos realizados e datas de cada depósito.
    footer_title: Esperamos que estas regras estejam claras.<br/> Nosso lema é que regras claras conservam a amizade!
    footer_thanks: Obrigado por participar de nossa comunidade!

