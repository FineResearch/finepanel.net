    total_amount: Queremos compartilhar com nossos panelistas e colaboradores que, segundo nossos registros, o total acumulado por esta campanha da comunidade Fine Panel a começos deste mês foi de
    side_bar:
      title: Fine Panel apóia
      link: Ver Campanha
    save_the_children:
      paragraph1: Segue a campanha com Save The Children no México, instituição que desenvolve programas diretos com a participação ativa de mais de 140.000 crianças e jovens em comunidades carentes de 15 Estados da República através de diferentes modalidades de atendimento.
      paragraph2: Na cidade de México especificamente, a Save the Children coordena uma rede de 140 Centros Comunitários de Desenvolvimento Infantil, nos quais promove a prestação de serviços de educação inicial, pré-escolar e cuidados diários, atingindo mais de 8.000 meninos e meninas
      mexico_letter: Carta de agradecimento de "Save the Children Mexico" à comunidade de Finepanel
      haiti_letter: Campanha de Ajuda a Haiti
      testimonial1: Se todos os seres humanos contribuíssemos neste tipo de iniciativas o mundo no qual vivemos seria diferente e melhor. Parabéns."
      testimonial2: Gostaria de parabenizar a decisão do Fine Panel de colaborar com este trabalho."
      testimonial3: Ajudar a quem precisa é extremamente importante, que bom que vocês o estão fazendo através deste caminho."
      testimonial4: As crianças do mundo devem ser a nossa preocupação continua e é um prazer saber que colaboramos nem que seja com um grão de areia no seu bem estar."
      testimonial5: É bom fazer parte de uma iniciativa  que consegue resultados."
      testimonial6: É uma pequena colaboração para o futuro da humanidade."
      testimonial7: Acho que é uma ideia muito honesta e  gostaria de continuar colaborando."
      testimonial8: Excelente proposta de ajuda, embora não conheça a fundação."
      testimonial9: Proposta excelente de poder ajudar a crianças com necessidades e falta de recursos."
      total_amount_html: Queremos compartilhar com nossos panelistas e colaboradores que, segundo nossos registros, o total acumulado por esta campanha da comunidade Fine Panel a começos deste mês foi de <strong>%{mexico_amount}</strong> para a Save The Children México e <strong>%{colombia_amount}</strong> para Save The Children Colômbia
    aacd:
      paragraph1: A comunidade de Fine Panel assinou um acordo com a AACD do Brasil para aqueles médicos que preferem doar seus honorários ao invés de receber os pagamentos na sua conta bancária.
      paragraph2: É muito importante para a AACD, Associação de Assistência à Criança Deficiente, poder contar com a colaboração de pessoas que acreditam na causa dos deficientes físicos. Afinal,  o apoio da sociedade permite á instituição realizar quase 6.000 atendimentos diários, em suas 9 unidades em todo o Brasil.
      paragraph3: "Para obter mais informação sobre a AACD e sobre outras formas de colaborar, por favor,acesse: www.aacd.org.br o ligue dentro do país para 0800-771 78 78."
      paragraph4: Esperamos sua valiosa participação!
      letter: Carta de agradecimento de "AACD" à comunidade de Finepanel

    icw:
      paragraph1: A comunidade de Fine Panel assinou um acordo com a ICW - comunidade internacional de mulheres com VIH para seu programa de meninas e adolescentes, para oferecer uma opção aos médicos que preferem doar  seus honorários ao invés de  receber os pagamentos nas suas contas bancárias.
      paragraph2: A ICW Global apoia, informa e representa às mulheres e meninas com VIH-SIDA, promovendo sua participação em espaços onde são debatidas as políticas públicas que as afetam. Desde 2007 impulsiona a campanha mundial MAIS PAZ MENOS SIDA como ferramenta para deter a pandemia. Para consultas escreva para info@icwglobal.org
      paragraph3: Para obter mais informação sobre a ICW e outras formas de colaborar, pode escrever para info@icwglobal.org
      paragraph4: Aguardamos sua valiosa participação!
      letter: Carta de agradecimento de "ICW" à comunidade de Fine Panel

  commitments:
    page_title: Compromisso ético
    page_subtitle: Regras que regem esta comunidade
    standards: PADRÕES.
    standards_p: As pesquisas da Fine Panel em toda a América Latina são realizadas em conformidade com os estritos padrões de ética das organizações internacionais mais prestigiosas que regulam a atividade na Europa (EPHMRA e ESOMAR) e nos Estados Unidos (PMRG).
    privacy: PRIVACIDADE.
    privacy_p: Os dados pessoais dos panelistas participantes não serão em caso algum compartilhados com terceiros, nem vinculados de forma alguma com suas respostas em qualquer uma das pesquisas realizadas. A única exceção a esta regra é em casos de saúde pública ou no caso de apresentação de Eventos Adversos (AE) de algum tratamento, e apenas em casos em que os entrevistados tenham aceitado, previamente, compartilhar seus dados.
    fees: PAGAMENTO DE HONORÁRIOS.
    fees_p: "A Fine Panel pagará sempre nos prazos e formas combinados,  todos os honorários prometidos pela participação em pesquisas segundo as  regras voluntariamente aceitas pelos  panelistas participantes. Para garantir a transparência no depósito de honorários seguiremos as regras a seguir:"
    fees_li1: Após cada participação efetiva o participante receberá um correio eletrônico informando o  resultado de sua participação, o valor creditado e o nome do projeto completado.
    fees_li2: Os depósitos serão feitos dentro das 4 semanas seguintes a sua participação.
    fees_li3: Os panelistas receberão, no dia do pagamento, um e-mail informando a data de pagamento, modalidade de pagamento e quantia creditada.
    fees_li4: Caso for requerido, poderão solicitar o comprovante bancário da transferência.
    fees_li5: Em todo momento poderão verificar o resultado de suas participações e os pagamentos recentes, acessando sua conta.
    fees_li6: Os pagamento serão realizados, salvo indicação em contrário no convite da pesquisa, em moeda local através de transferência ou deposito bancário.
    fees_li7: A Fine Panel sempre identificará com seu nome no assunto, os convites para participar em estudos de forma de evitar confusões com outras organizações que possam ter outras práticas ou compromissos de pagamentos. Lembre-se sempre de conferir que o convite recebido venha da Fine Panel.
    fees_li8: O honorário será creditado a quem tenha o perfil procurado e complete a pesquisa até o final, as quais normalmente levam entre 15 e 45 minutos. Caso o participante não tenha o perfil procurado para uma pesquisa - o qual será verificado após 1-2 minutos nas primeiras perguntas - a Fine Panel informará esta situação ao panelista e encerrará a pesquisa. Neste caso não se creditará o valor por completo, mas se o participante tiver investido pelo menos um minuto será pago até 10% dos honorários, algo que nos diferencia de outras organizações de pesquisa. A Fine Panel vai convidar-lhe a pesquisas que, segundo os nossos dados, poderão ser possivelmente adequadas ao seu perfil.
    fees_li9: Em todo momento pode escrever para honorarios@finepanel.net por qualquer consulta sobre suas participações e pagamentos.
    social_responsibility: RESPONSABILIDADE SOCIAL.
    social_responsibility_p: Na Fine Panel acreditamos na responsabilidade social comunitária nos países de América Latina onde desenvolvemos nossa atividade. Nesta área colaboramos ativamente com a Save The Children no México, a Associação de Assistência à Criança Deficiente (AACD) no Brasil e a Comunidade Internacional de Mulheres vivendo com HIV na Argentina (ICW).
    transparency: TRANSPARÊNCIAS DAS DOAÇÕES.
    transparency_p: "Para garantir a transparência da doação de créditos pela participação em pesquisas, quando os panelistas o escolherem, serão seguidas estas regras:"
    transparency_li1: Após cada participação efetiva onde o panelista decidir doar seu crédito, o participante receberá um correio eletrônico com copia à instituição informando a doação.
    transparency_li2: Em todo momento as  instituições poderão verificar na Fine Panel o valor acumulado pelas doações realizadas.
    willfulness: VOLUNTARIEDADE.
    willfulness_p: A participação na Fine Panel é voluntária. O(a) Sr.(a) poderá cadastrar-se, convidar outros colegas, atualizar a sua informação em qualquer momento e também poderá escolher ser excluído de nossa base de dados clicando no link de exclusão que está incluso em cada convite.
    mission: MISSÃO.
    mission_p: A Fine Panel é um instrumento de pesquisa e comunicação, a través da difusão de novidades, a troca de opiniões e a pesquisa de práticas relativas ao cuidado da saúde, o qual pode colaborar no desenvolvimento do conhecimento das necessidades de médicos e pacientes, e eventualmente contribuir na implementação de tratamentos adequados para a atenção dos mesmos.
    scope: ABRANGÊNCIA.
    scope_p: A Fine Panel é uma comunidade de participantes em pesquisas e um fórum de informação e intercâmbio com centros de apoio no Brasil, México, Chile, Argentina, Colômbia, Venezuela e cobertura em toda a América Latina, direcionado exclusivamente a médicos e profissionais de saúde legalmente registrados nestes países.
    responsibility: RESPONSABILIDADE.
    responsibility_p: As opiniões médicas ou de outro tipo expressadas durante o preenchimento das pesquisas ou dentro da rede social da Fine Panel, seja no mural ou compartilhando documento ou arquivos, é de autoria e responsabilidade exclusiva dos panelistas participantes.
    autonomy: AUTONOMIA.
    autonomy_p: A Fine Panel não realiza atividades de promoção, publicidade nem estudos clínicos  limitando sua atividade à realização de pesquisa de mercado e opinião, apresentação de novos conceitos com fins de pesquisa e/ou divulgação de informação de artigos publicados em revistas de sociedades médicas credenciadas.

