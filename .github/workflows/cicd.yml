name: Build, push and deploy
on:
  push:
    branches:
      - develop
      - new-dockerization
jobs:
  build-and-push:
    name: Build and push image to AWS ECR
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v1

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: finepanel
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile.release -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deployment:
    name: Deploy stack to AWS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.6.0
        with:
          access_token: ${{ github.token }}

      - name: Deploy CloudFormation Stack
        id: ecs-cluster
        uses: jzeni/cloudformation-update-action@master
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          CAPABILITIES: '["CAPABILITY_NAMED_IAM"]'
          STACK_NAME: FP-Stg-Servics
          PARAMETER_OVERRIDES: '[{ "parameter_key": "ApiImageTag", "parameter_value": "${{ github.sha }}" }]'
          FOLLOW_STATUS: true
          ATTEMPTS_DELAY: 10
          MAX_ATTEMPTS: 60
          CANCEL_ON_TIMEOUT: true
