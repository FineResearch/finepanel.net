version: '3.5'

services:
  postgres:
    image: postgres:10
    volumes:
      - ./data:/var/lib/postgresql/data
    expose:
      - 5432

  app:
    build:
      context: app
    image: finepanel:latest
    volumes:
      - $PWD/app:/usr/src/app
    depends_on:
      - postgres
      - sidekiq
      - redis

  redis:
    image: redis:latest
    expose:
      - 6379

  sidekiq:
    build:
      context: app
    image: finepanel:latest
    depends_on:
      - redis
    volumes:
      - $PWD/app:/usr/src/app
    env_file:
      - app/.env
    command: bundle exec sidekiq -C config/sidekiq.yml
