  faq:
    page_title: Preguntas Frecuentes
    up: Arriba
    all_questions: Ver todas las preguntas
    button_assistance: Solicite asistencia
    questions:
      q1: ¿Cuáles son las ventajas de participar de las encuestas de Fine Panel?
      q2: ¿Cómo serán tratadas mis respuestas y datos personales?
      q3: ¿Quién participa en esta comunidad?
      q4: ¿Acerca de qué estudios voy a ser invitado a participar?
      q5: ¿Cómo puedo saber cuánto voy a recibir por cada participación?
      q6: ¿Qué tengo que hacer para recibir mis honorarios?
      q7: ¿Qué plazo tengo para participar de una invitación?
      q8: ¿Por qué se busca un perfil específico?
      q9: ¿Cómo puedo saber si tengo el perfil buscado?
      q10: Si lo intento participar pero luego no tengo el perfil de ese proyecto ¿igual soy recompensado?
      q11: ¿Puedo participar regularmente?
      q12: ¿Cómo se me pagará?
      q13: ¿Cuándo se me pagará?
      q14: ¿Cómo puedo controlar mis pagos y participaciones?
    answers:
      a1: Es un canal para que pueda influir con su opinión y experiencia sobre las discusiones de las futuras lineas terapéuticas, enterarse de innovaciones en su área, con las ventajas de participar on-line en el horario que le quede más cómodo y por el cual es recompensado con honorarios depositados en su cuenta bancaria.
      a2: Con la máxima confidencialidad. Sus datos personales nunca serán cedidos a terceros ni ligados a ninguna respuesta, siguiendo las estrictas reglas de la Sociedad Europea de Investigación de Mercados (www.esomar.org) y la Sociedad Europea de Investigación Farmacéutica (www.ephmra.org)
      a3: Las encuestas se destinan exclusivamente a médicos activos que viven en América Latina, registrados en conformidad con la ley aplicable. Tenemos miles de participantes regulares.
      a4: Dependiendo de su práctica médica y de especialidades, lo invitaremos a las diferentes encuestas que pueden ser de su interés.
      a5: El honorario se indica en la carta de invitación
      a6: El honorario se paga a quienes tiene el perfil buscado para cada proyecto y completan la encuesta en su totalidad. Las investigaciones tienen una duración de aproximadamente 15-40 minutos, dependiendo del proyecto y su navegador)
      a7: Los proyectos tienen un tiempo limitado -por lo general días- y además se busca una cantidad de entrevistas determinada, así que cuanto antes participe mejor. Si el proyecto ya está cerrado cuando Ud. Participa el sistema se lo informará.
      a8: En toda investigación hay un público objetivo, que depende de los criterios y el área de interés del equipo de investigación. A veces la demanda de un determinado tipo de pacientes o la práctica (pública o privada), o cualquier otro criterio. No tener el perfil de una búsqueda en particular no significa no ser un gran profesional!
      a9: Se verifica a través de algunas preguntas iniciales lo que no lleva mas de 1-2 minutos.
      a10: Si. En este caso no le vamos a pedir que haga la entrevista completa que dura entre 15 a 40 minutos. Pero compensamos esos intentos de 1-2 minutos, con el 10% del honorario prometido para la encuesta completa. El importe se ingresará en su cuenta bancaria cuando el crédito acumulado sea superior a $500 (Mexico) / 150$ (Argentina) / R$100 (Brasil) o con la siguiente entrevista completa.
      a11: Dependerá de las investigaciones disponibles referentes a su especialidad, pero posiblemente si! Nuestra organización lleva a cabo más de 100 estudios médicos por año con diferentes tipos de especialistas tan pronto como le sea posible tener más posibilidades de participar.
      a12: Recibirá el pago por sus participaciones via trasnferencia bancaria en una cuenta que nos proporcione a su nombre.
      a13: Los pagos por incentivos por las encuestas que complete se procesan dentro de las 48 horas hábiles de su participación. Usted recibirá un correo electrónico confirmando los detalles de pago, fecha y cantidad, una vez hecho el mismo. En el caso de República Dominicana y Guatemala, los pagos se realizan via Western Union o Paypal dentro de las 4 semanas.
      a14: Fine Panel permite un acceso trasparente a sus creditos y participaciones. Si desea verificar su crédito puede verlo en cualquier momento luego de completar una primera entrevista. Debe ir a la página www.finepanel.net y usando su correo y  contraseña. Allí podrá ver si quiere las ultimas participaciones, estado de cada una, pagos realizados y fecha de cada pago. Tambien puede bajar la aplicación Fine Panel disponible en Google Play y Apple Store.
    footer_title: Esperamos que estas reglas esten claras.<br/> Nuestro lema es que las reglas claras conservan la amistad!
    footer_thanks: Gracias por participar en nuestra comunidad!

