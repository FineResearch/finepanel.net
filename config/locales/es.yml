  campaigns:
    page_title: Campañas
    panelists_comments: Comentarios de panelistas sobre nuestra campaña!
    total_amount: "Queremos compartir con nuestros panelistas y colaboradores que segun nuestros registros el total acumulado por esta campaña de la comunidad Fine Panel a comienzos de este mes fue de "
    side_bar:
      title: Fine Panel apoya
      link: Ver Campaña
    save_the_children:
      paragraph1: La comunidad Fine Panel ha firmado un acuerdo con Save The Children Mexico, institución que desarrolla programas directos con la participación activa de más de 140,000 niños, niñas y jóvenes en comunidades marginadas de 15 Estados de la República a través de diferentes modalidades de atención.
      paragraph2: En la Ciudad de México en particular, Save the Children coordina una red de 140 Centros Comunitarios de Desarrollo Infantil, en los que promueve la prestación de servicios de educación inicial, preescolar y de cuidado diario, llegando a más de 8,000 niños y niñas.
      mexico_letter: Carta de agradecimiento de "Save the Children Mexico" a la comunidad de Fine Panel
      haiti_letter: Campaña de Ayuda a Haiti
      testimonial1:
        text: Que si todos los seres humanos contribuyeramos en este tipo de iniciativas el mundo en el que vivimos sería diferente y mejor. Felicidades."
        name: Dra. Rosalva Amelia Lopez Gutierrez de Ubiarco.
      testimonial2:
        text: Aplaudo la decisión de Fine Panel de colaborar con esta obra."
        name: Dr. Sigfrido Miracle Lopez.
      testimonial3:
        text: El ayudar al que necesita es de suma importancia que bueno que lo estan haciendo ustedes por este conducto."
        name: Dr. Luis Fernando Ceballos Galan.
      testimonial4:
        text: La infancia del mundo debe de ser nuestra preocupación continua y es un gusto saber que cooperamos aunque sea con un granito de arena en su bienestar."
        name: Dr. Jesus Joaquin Gregorio Montaño Sanchez.
      testimonial5:
        text: Es bueno ser parte de una iniciativa que logra resultados."
        name: Dr. Julio Guadalupe Juarez Mendez.
      testimonial6:
        text: Es una pequeña colaboración para el futuro de la humanidad."
        name: Dr. Carlos Shigueyoshi Higashida Hirose.
      testimonial7:
        text: Me parece una idea muy honesta y nos gustaria continuar colaborando."
        name: Dr. Roberto Mar.
      testimonial8:
        text: Excelente propuesta de ayuda, aunque no connozco la fundación."
        name: Dr. Alfonso Rodriguez Jaramillo.
      testimonial9:
        text: Propuesta excelente y poder ayudar a niños necesitados y faltos de recursos."
        name: Dr. Amando Roberto Piña Loaiza.
      total_amount_html: Queremos compartir con nuestros panelistas y colaboradores que segun nuestros registros el total acumulado por esta campaña de la comunidad Fine Panel a comienzos de este mes fue de <strong>%{mexico_amount}</strong> para Save The Children Mexico y <strong>%{colombia_amount}</strong> para Save The Children Colombia
    aacd:
      paragraph1: La comunidad Fine Panel ha firmado un acuerdo con AACD de Brasil para los médicos que prefieren donar en lugar de recibir pagos en su cuenta bancaria.
      paragraph2: Es muy importante para la AACD, Asociación de Ayuda a niños discapacitados, contar con la cooperación de personas que creen en la causa de los discapacitados físicos. Después de todo, el apoyo de la sociedad permite a la institución llevar a cabo casi 6.000 atenciones diarias, en sus 9 unidades en todo Brasil.
      paragraph3: "Para obtener más información acerca de AACD y otras formas de colaborar, por favor visite: www.aacd.org.br o llame dentro del pais al: 0800-771 78 78."
      paragraph4: ¡Esperamos su valiosa participación!
      letter: Carta de agradecimiento de "AACD" a la comunidad de Fine Panel
    garrahan:
      paragraph1: La comunidad Fine Panel ha firmado un acuerdo con la Fundacion Garrahan para apoyar su programa para Casa Garrahan de modo de dar una opción a los médicos que prefieren donar en lugar de recibir pagos en su cuenta bancaria.
      paragraph2: La Casa Garrahan fue inaugurada el 25 de marzo de 1997 y presta especial atención a las necesidades sociales y emocionales de los pacientes y sus familias. Brinda un hogar a los niños, junto a sus madres, que residen a más de 100 kilómetros de la Ciudad de Buenos Aires y se atienden en los hospitales Elizalde, Garrahan o Gutiérrez y se hospedan mientras cumplen tratamientos médicos ambulatorios o esperan diagnósticos de complejas enfermedades que no requieren internación.
      paragraph3: Aloja alrededor de 1000 niños por año.
      paragraph4: "Para obtener más información acerca de la Fundacion Garrahan y otras formas de colaborar, puede escribir a casa@fhg.org.ar -  Pichincha 1731 - CABA • Teléfono: (011) 4308-5229/5236"
      paragraph5: ¡Esperamos su valiosa participación!
      commodity_title: "Casa Garrahan cuenta con:"
      commodities:
        - 43 habitaciones con baño privado.
        - Amplias cocinas.
        - Sala de estar, de juegos y de computación.
        - Biblioteca.
        - Lavadero.
        - Patios de juegos.
        - 3 habitaciones con múltiples propósitos. Talleres educativos y espacio de formación.


  commitments:
    page_title: Compromiso ético
    page_subtitle: Las reglas éticas que rigen esta comunidad son las siguientes
    standards: ESTANDARES.
    standards_p: Las investigaciones realizadas en Fine Panel en toda América Latina se realizan siguiendo los estrictos estándares éticos de las organizaciones internacionales más prestigiosas que regulan la actividad en Europa (EPHMRA, BHBIA y ESOMAR) y Estados Unidos (INTELLUS), y a las cuales pertenecen sus investigadores.
    privacy: PRIVACIDAD.
    privacy_p: Los datos personales de los panelistas participantes no serán en ningún caso compartidos con terceros, ni conectados de ningún modo con sus respuestas en cualquiera de las encuestas realizadas. Solo se podrá exceptuar esta regla por cuestiones de salud pública en caso de presentarse Eventos Adversos de algún tratamiento y solo en casos en que los entrevistados hayan aceptado previamente compartir sus datos para tal caso.
    fees: PAGOS DE HONORARIOS.
    fees_p: Fine Panel pagará siempre en tiempo y forma todos los honorarios prometidos por participación en encuestas según las reglas voluntariamente aceptadas por los panelistas participantes. Para asegurar la transparencia en el deposito de honorarios se seguirán las siguientes reglas
    fees_li1: Después de cada participación efectiva el participante recibirá un correo electrónico informando el resultado de su participación,  el valor acreditado y el nombre del proyecto completado.
    fees_li2: Los depósitos se harán dentro de las 4 semanas siguientes a su participación. En el caso de Argentina, Brasil, Chile, Costa Rica, Colombia, Ecuador, Mexico, Panamá y Peru, el pago se efectiviza a las 48 horas habiles de su última encuesta completa.
    fees_li3: Los panelistas recibirán el día del pago un email informando, fecha de pago, modo de pago y valor acreditado.
    fees_li4: En caso que así lo requieran podrán solicitar el comprobante bancario de la transferencia.
    fees_li5: En todo momento podrá verificar  el resultado de sus participaciones y pagos recientes, ingresando a su cuenta.
    fees_li6: Los pagos se harán salvo indicación en contrario en la invitación en moneda local por transferencia o depósito bancario.
    fees_li7: Fine Panel siempre identificara con su nombre en el asunto, las invitaciones para participar en estudios de modo de evitar confusiones con otras organizaciones que puedan tener otras practicas y compromisos de pago. Recuerde siempre de verificar que la participación que reciba provenga de Fine Panel.
    fees_li8: El honorario corresponderá a quien tiene el perfil buscado y complete hasta el final cada encuesta, lo que usualmente lleva entre 15 y 45 minutos. En caso de no tener el perfil buscado en una encuesta, lo cual se verifica luego de un par de minutos, en las primeras preguntas, Fine Panel informará esta situación al panelista y terminará la encuesta. En estos casos no se acreditará el valor completo pero si invirtió por lo menos un minuto se le acreditará un 10% del honorario, algo que nos diferencia de otros investigadores. Fine Panel intentará siempre invitarlo a estudios que según la información que contamos serían posiblemente adecuados a su perfil.
    fees_li9: En cualquier momento puede escribir a honorarios@finepanel.net por cualquier consulta respecto a sus participaciones y pagos.
    social_responsibility: RESPONSABILIDAD SOCIAL.
    social_responsibility_p: En Fine Panel creemos en la responsabilidad social comunitaria en los países de América Latina donde desarrollamos nuestra actividad. En esta área colaboramos activamente con Save The Children en Colombia y México, la Asociación Brasileña de Atención a los Niños con Discapacidad (AACD) y a la Fundación del Hospital Garrahan en Argentina.
    transparency: TRANSPARENCIA DE LAS DONACIONES.
    transparency_p: Para asegurar transparencia en la donación de créditos por participación en encuestas, cuando así lo escogieran los panelistas se seguirán las siguientes reglas
    transparency_li1: Después de cada participación efectiva donde el panelista decidiera donar su crédito, el participante con copia a la institución recibirá un correo electrónico informando la donación.
    transparency_li2: En todo momento las instituciones podrán verificar en Fine Panel el valor acumulado por las donaciones realizadas el cual se actualiza en tiempo real en este site (cliquee en Campañas para más información).
    willfulness: VOLUNTARIEDAD.
    willfulness_p: La participación en Fine Panel es voluntaria, Ud. Podrá registrase, invitar a otros colegas, actualizar su información en cualquier momento y también optar por ser excluido de nuestra base de datos cliqueando en el link de exclusión que se incluye en cada invitación.
    mission: MISION.
    mission_p: Fine Panel es un instrumento de investigación y comunicación, a través de la difusión de novedades, el intercambio de opiniones y la investigación de practicas relativas al cuidado de la salud, todo lo cual puede colaborar en el desarrollo del conocimiento de las necesidades de médicos y pacientes, y eventualmente contribuir a la implementación de tratamientos adecuados a la atención de las mismas.
    scope: ALCANCE.
    scope_p: Fine Panel es una comunidad de participantes en encuestas y foro de información e intercambio con centros de soporte en Brasil, México, Chile, Argentina, Colombia, Uruguay y cobertura en toda América Latina, dirigido exclusivamente a médicos y profesionales de la salud legalmente registrados en estos países
    responsibility: RESPONSABILIDAD.
    responsibility_p: Las opiniones médicas o de otro tipo vertidas durante el llenado de encuestas o dentro de la red social de Fine Panel, ya sea en el muro o compartiendo documento o archivos es de exclusiva autoría y responsabilidad de los panelistas participantes.
    autonomy: AUTONOMIA.
    autonomy_p: Fine Panel no realiza actividades de promoción, publicidad ni estudios clínicos limitando su actividad a la realización de estudios médicos de opinión, presentación de nuevos conceptos con fines de investigación de mercado y faciltar acceso gratuito de herramientas de medicina basada en evidencias a los profesionales que integran la red.

  privacy:
    page_title: Aviso de Privacidad
    date: Este Aviso de privacidad entró en vigencia el 8 de agosto de 2019.
    line1: En Fine Panel, reconocemos la importancia de proteger su información personal y nos comprometemos a procesarla de manera responsable y de acuerdo con las leyes de protección de datos aplicables en todos los países en los que operamos.
    line2: En el curso normal de sus actividades comerciales, Fine Panel recopila, utiliza y, a veces, comparte información para realizar sus operaciones diarias. Este Aviso de privacidad describe las prácticas generales de privacidad de Fine Panel que se aplican a la recopilación y el uso de dicha información personal.
    subtitle_1: TIPOS DE INFORMACIÓN PERSONAL QUE RECOPILAMOS
    sub1_li1: Al describir nuestra recopilación, uso e intercambio de información en este Aviso, nos referimos a nuestra recopilación y uso de "Información personal".
    sub1_li2: La "información personal" tal como se utiliza en este aviso es cualquier información relacionada con un individuo identificado o identificable. Ejemplos de información personal incluyen nombre y apellido, dirección postal, dirección de correo electrónico, información de pago, dirección IP, otra información de contacto en línea o número de teléfono.
    sub1_li3: Recopilamos la información que usted proporciona voluntariamente en los formularios de solicitud en nuestro sitio como respuestas a la encuesta y / o podemos obtener información, incluida información personal, de fuentes de terceros que cumplan con este aviso de privacidad y / o de sitios web públicos.
    sub1_li4: Los datos personales de los panelistas participantes no se compartirán de ninguna manera con terceros, ni se vincularán a sus respuestas en ninguna de las encuestas realizadas. La única excepción a esta regla es en casos de salud pública o en caso de presentación de algún evento adverso (EA) de algún tratamiento, y solo en casos en que los encuestados hayan acordado previamente compartir sus datos.
    sub1_li5: Sus datos pueden transferirse internacionalmente a las diferentes oficinas que forman parte de la red de Fine Panel, incluidas las filiales de Fine Brazil Researches Ltda, Fine Research SRL (Argentina), FR Research SA de CV (México), sucursal de Fine Research Latinoamerica SA Colombia y Fine Research Latin America SA (Uruguay)
    sub1_li6: "Solo usamos sus datos para:"
    sub1_list1: invitarlo a acceder a nuestras encuestas disponibles
    sub1_list2: acceder a herramientas de contenido médico basadas en evidencia
    sub1_list3: verificar la validez de las identidades de los profesionales de la salud y prevenir el fraude
    sub1_list4: procesar pagos tarifa por investigación
    sub1_list5: proporcionar advertencias a los investigadores involucrados en Eventos Adversos (AE) y expresamente establecidos en este Aviso
    sub1_list6: para mantener las operaciones comerciales, como con los proveedores que trabajan en nuestro nombre y garantizar que se adhieran a las mismas prácticas que este aviso de privacidad.
    sub1_list7: según lo requiera la ley o para responder al proceso legal
    sub1_list8: en otros casos con su consentimiento expreso
    sub1_li7: Si surge la necesidad de usar sus datos para un propósito secundario, le proporcionaremos un Aviso de dicho uso.
    sub1_li8: Si tiene preguntas o necesita más información sobre la base legal sobre la que recopilamos y usamos su información personal, contáctenos a support@finepanel.net.
    sub1_li9: No compartimos su información personal con terceros, excepto lo indicado en este documento.

    subtitle_2: DÓNDE ALMACENAMOS Y PROCESAMOS SU INFORMACIÓN PERSONAL
    sub2_li1: Los datos personales recopilados por Fine Panel pueden almacenarse y procesarse en su región, Brasil y cualquier otro país. Las ubicaciones de almacenamiento se eligen para operar de manera eficiente, mejorar el rendimiento y crear redundancias para proteger los datos en caso de falla u otro problema. Tomamos medidas para garantizar que los datos que recopilamos bajo este Aviso se procesen de acuerdo con las disposiciones de este Aviso y los requisitos de la ley aplicable, donde sea que se encuentren los datos
    sub2_li2: Fine Panel cumple con la Ley General de Protección de Datos, LGPD y GDPR con respecto a la recopilación, uso y retención de información personal transferida desde Brasil, el resto de América Latina, la Unión Europea y los Estados Unidos.

    subtitle_3: CÓMO GARANTIZAMOS SU INFORMACIÓN PERSONAL
    sub3_li1: Fine Panel utiliza una variedad de tecnologías para proteger eficazmente sus datos personales del acceso, uso o divulgación no autorizados. Si bien implementamos salvaguardas diseñadas para proteger su información, sabemos que ningún sistema de seguridad es impenetrable y debido a la naturaleza inherente de Internet, pero siempre utilizaremos procedimientos de seguridad razonables y adecuados.

    subtitle_4: CUÁNTO TIEMPO RETENDRÁ SU INFORMACIÓN PERSONAL
    sub4_li1: Conservaremos la información personal que recopilamos de usted cuando exista una necesidad comercial legítima en curso (por ejemplo, para proporcionar un servicio que haya solicitado o para cumplir con los requisitos legales, fiscales o contables aplicables).
    sub4_li2: Cuando no tengamos una necesidad comercial legítima en curso para procesar su información personal, eliminaremos o anonimizaremos sus datos o, si eso no es posible (por ejemplo, porque su información personal se ha almacenado en archivos de respaldo), entonces almacenaremos de forma segura la información personal y aislarlo de cualquier procesamiento posterior hasta que sea posible eliminarlo.

    subtitle_5: CÓMO ACCEDER Y CONTROLAR SU INFORMACIÓN PERSONAL
    sub5_li1: Puede ejercer sus derechos poniéndose en contacto con nosotros en support@finepanel.net
    sub5_li2: Respondemos a todas las solicitudes que recibimos de personas que desean ejercer sus derechos de protección de datos de acuerdo con las leyes de protección de datos aplicables.

    subtitle_6: AVISO DE BAJA
    sub6_li1: Puede optar por no recibir contactos haciendo clic en "Cancelar suscripción" en la parte inferior del correo electrónico que recibió las invitaciones.

    subtitle_7: COMO CONTACTARNOS
    sub7_li1: Para ejercer los derechos de sus interesados, comuníquese con support@finepanel.net
    sub7_li2: "O puede contactarnos utilizando la siguiente información:"
    sub7_li3: Fine do Brasil Research Ltda - Avenidaq Paulista 2494, 7th piso, Sao Paulo Brasil
    sub7_li4: Fine Research SRL - Olazabal 1334, Ciudad Autonoma de Buenos Aires, Argentina
    privacy_policy_text: 'Al dar su consentimiento, acepta que los datos personales que comparte solo se utilizarán con fines de investigación de mercado y / o para recibir evidencia médica y noticias por correo electrónico. Sus datos personales nunca se cederán a terceros, siguiendo las estrictas normas de la Sociedad Europea de Estudios de Mercado. La única excepción a esta regla es en casos de salud pública si el encuestado expresa Eventos Adversos (EA) de algún tratamiento, Solo usamos sus datos para: invitarlo a acceder a nuestras encuestas disponibles, dar acceso a herramientas de contenido basadas en evidencia médica, verificar la validez de las identidades de los profesionales de la salud y prevenir el fraude, procesar los pagos de las tarifas de investigación o proporcionar avisos a los investigadores involucrados en Eventos Adversos (EA) y expresamente establecidos en este Aviso, para mantener las operaciones comerciales, como con los proveedores que trabajan en nuestra en nombre y asegurándose de que se adhieran a las mismas prácticas en este aviso de privacidad según lo requiera la ley o para responder a procesos legales o en otros casos con su consentimiento expreso. Puede ver nuestro aviso de privacidad completo en <a href="https://www.fine-research.com/es/blog/news/fine-actualiza-su-aviso-de-privacidad/" target="_blank"> Aviso de privacidad </a>'

  dynamed_content:
    line1: Fine Panel ofrece a todos sus miembros la herramienta DynaMed para acceder a contenido médico basado en evidencia sin costos ni suscripciones.
    line2: Está disponible a través de la aplicación Fine Panel.
    line3: Para acceder por primera vez en la aplicación Fine Panel, ingrese con su correo electrónico
    line4: y su contraseña
    subtitle_1: ¿Qué es DynaMed?
    sub1_li1: DynaMed™ es una fuente de información basada en evidencia clínica de próxima generación diseñada para optimizar el tiempo de respuesta para los profesionales de la salud.
    sub1_li2: El contenido de DynaMed es actualizado permanentemente por un equipo de médicos de clase mundial que se consideran expertos en sus campos. Traen su conocimiento a la mesa seleccionando la mejor evidencia y adhiriéndose a una metodología rigurosa basada en evidencia que asegura que el contenido representa la visión más precisa de la evidencia con el menor potencial de conflicto de intereses, influencia personal o aceptación acrítica.
    sub1_li3: Las recomendaciones siempre se basan en evidencia y nunca en la experiencia u opinión del autor. El contenido de DynaMed incluye miles de temas que cubren medicina de emergencia, cardiología, oncología, enfermedades infecciosas, pediatría, obstetricia y ginecología y más.
    line5: Tome en cuenta que el contenido de DynaMed esta disponible por el momento solo en inglés.
    line6: Además, en la aplicación Fine Panel puede
    li5_list1: Participar más fácilmente en las encuestas disponibles.
    li5_list2: Revisar su cuenta para créditos y pagos.
